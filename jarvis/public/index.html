<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>JARVIS for Baba</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div>
          <h1>JARVIS</h1>
          <p class="sub">Voice command center for Baba. Secrets stay on the server.</p>
        </div>
        <div class="badge" id="modeBadge">mock</div>
      </header>

      <section class="card" id="loginCard">
        <label for="accessCode">Access code</label>
        <input id="accessCode" type="password" autocomplete="current-password" placeholder="JARVIS_ACCESS_CODE" />
        <div class="row" style="margin-top:10px">
          <button class="primary" id="loginBtn" type="button">Unlock</button>
        </div>
        <p class="status" id="loginStatus">If no code is configured on the server, Unlock still issues a local session.</p>
      </section>

      <section class="card hidden" id="consoleCard">
        <button class="mic" id="ptt" type="button">Hold to talk</button>
        <p class="status" id="micStatus">Push to talk uses Galaxy Chrome speech recognition. The server never receives your OpenAI key in the browser.</p>
        <div class="row" style="margin-top:10px">
          <input id="textInput" placeholder="Or type a command" />
          <button class="primary" id="sendBtn" type="button">Send</button>
        </div>
        <label class="toggle" style="margin-top:12px">
          <input id="memoryToggle" type="checkbox" checked />
          <span>Configurable memory on</span>
        </label>
      </section>

      <section class="card hidden" id="logCard">
        <div class="log" id="log"></div>
      </section>

      <section class="card hidden" id="dashCard">
        <h2 style="margin:0 0 10px;font-size:1rem">Command dashboard</h2>
        <div class="grid" id="tools"></div>
        <p class="status" id="dashStatus" style="margin-top:10px"></p>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
